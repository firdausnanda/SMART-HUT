; ============================================================
; PHP-FPM Pool Configuration for SMART-HUT (KDA)
; Applied via: /usr/local/etc/php-fpm.d/www.conf
; ============================================================

[www]
user = www-data
group = www-data

; Listen on localhost TCP socket (matches nginx fastcgi_pass)
listen = 127.0.0.1:9000

; --- Process Manager ---
; Dynamic PM: scales between min/max based on demand
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10

; Recycle workers after N requests to prevent memory leaks
pm.max_requests = 500

; Kill PHP-FPM worker if a single HTTP request exceeds this (seconds)
; Note: queue workers have their own timeout in supervisor (--timeout=1800)
;       and are NOT processed through PHP-FPM
request_terminate_timeout = 120

; --- Logging ---
access.log = /dev/null
slowlog = /dev/stderr
request_slowlog_timeout = 10s

; --- Environment passthrough ---
; Pass environment variables to PHP-FPM workers
clear_env = no
