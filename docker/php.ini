; ============================================================
; PHP Production Settings for SMART-HUT (KDA)
; Applied via: /usr/local/etc/php/conf.d/app.ini
; ============================================================

; --- Memory & Execution ---
; 512M required to parse large Excel files (5.000+ rows via PhpSpreadsheet/Maatwebsite)
memory_limit = 512M
max_execution_time = 120
max_input_time = 120

; --- File Uploads ---
; Must be consistent with nginx client_max_body_size (64M)
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; --- Error Reporting (production) ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Misc ---
; Increase max input vars for large forms
max_input_vars = 3000
