; ============================================================
; Supervisor Config — Standalone Queue Worker Container
; SMART-HUT (KDA)
;
; Used by docker-compose 'worker' service when running as a
; dedicated worker container (separate from the 'app' container).
; The 'app' container supervisord.conf already includes 2 workers;
; use this file when you want additional/dedicated worker replicas.
; ============================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

[program:laravel-worker]
; Handles 'imports' queue first (priority), then 'default'
; --timeout=1800  : allows up to 30 min per job (5K row Excel import)
; --memory=512    : restart worker if memory exceeds 512MB
; --tries=1       : do not auto-retry failed import jobs (prevent duplicate data)
; --max-jobs=500  : recycle worker process after 500 jobs (prevent memory drift)
; --max-time=3600 : gracefully restart worker after 1 hour
command=php /var/www/html/artisan queue:work --queue=imports,default --timeout=1800 --memory=512 --tries=1 --sleep=3 --max-jobs=500 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=4
autostart=true
autorestart=true
; Must be > --timeout to allow graceful job completion before SIGKILL
stopwaitsecs=1900
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
