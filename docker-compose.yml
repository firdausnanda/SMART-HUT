services:
  # ---------------------------------------------------------------------------
  # Laravel Application (Web + PHP-FPM + Supervisor)
  # Supervisor inside this container runs:
  #   - php-fpm       (process HTTP requests)
  #   - nginx         (serve static assets & reverse proxy to php-fpm)
  #   - laravel-schedule (artisan schedule:work)
  #   - laravel-worker   (2 processes, queue=imports,default, timeout=1800)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kda-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - RUN_MIGRATIONS=true          # Set to true to run migrations on startup
      - LOG_CHANNEL=${LOG_CHANNEL:-daily}  # Fallback to 'daily' if not set in .env
      - QUEUE_CONNECTION=database    # Ensure queue driver is database (not sync)
    env_file:
      - .env
    volumes:
      - kda-storage:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    # Resolves host.docker.internal to host's gateway on Windows/Mac/Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - laradock_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Standalone Queue Worker Container (optional — for extra worker capacity)
  #
  # The 'app' container already runs 2 worker processes via its supervisord.conf.
  # This dedicated 'worker' container adds 4 MORE worker processes (worker.conf)
  # for heavier import workloads. Disable this service if the 2 workers in 'app'
  # are sufficient.
  #
  # It runs supervisor with docker/worker.conf (4 processes, timeout=1800)
  # instead of the full supervisord.conf (no nginx/php-fpm overhead).
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kda-worker
    restart: unless-stopped
    # Override default entrypoint to run supervisor with the worker-only config
    command: ["/usr/local/bin/entrypoint.sh", "supervisord", "-c", "/etc/supervisor/conf.d/worker.conf"]
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - QUEUE_CONNECTION=database    # Explicit override for worker container
    env_file:
      - .env
    volumes:
      - kda-storage:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    # Resolves host.docker.internal to host's gateway on Windows/Mac/Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - laradock_net
    # Worker containers do not expose ports; no healthcheck needed via HTTP.
    # The supervisor process itself keeps workers alive (autorestart=true).

volumes:
  kda-storage:

networks:
  laradock_net:
    external: true
    name: laradock_cdk_trenggalek_backend
